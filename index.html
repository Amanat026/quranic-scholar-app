<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d5c46" />
  <title>Quranic Guidance Scholar</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-mark">﷽</div>
        <div class="header-text">
          <h1>Quranic Guidance Scholar</h1>
          <p>Ask anything — answered with Quran &amp; wisdom</p>
        </div>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <div class="message assistant">
        <div class="bubble">
          <p>Assalamu alaikum. I am here to offer guidance from the Holy Quran — on any action, problem, decision, or moral question. How may I help you today?</p>
        </div>
      </div>
    </main>

    <form id="composer" class="composer">
      <input
        id="question"
        type="text"
        placeholder="Ask your question…"
        autocomplete="off"
        maxlength="2000"
        required
      />
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </form>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
