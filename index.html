<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d5c46" />
  <title>Quranic Guidance Scholar — কুরআনিক দিকনির্দেশনা</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-mark">﷽</div>
        <div class="header-text">
          <h1 id="app-title">Quranic Guidance Scholar</h1>
          <p id="app-subtitle">Ask anything — answered with Quran &amp; wisdom</p>
        </div>
        <div class="lang-switch" role="group" aria-label="Language">
          <button id="lang-en" class="lang-btn active" type="button">EN</button>
          <button id="lang-bn" class="lang-btn" type="button">বাং</button>
        </div>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <div class="message assistant">
        <div class="bubble">
          <p id="welcome-msg">Assalamu alaikum. I am here to offer guidance from the Holy Quran — on any action, problem, decision, or moral question. You may write or speak in English or Bangla. How may I help you today?</p>
        </div>
      </div>
    </main>

    <form id="composer" class="composer">
      <button id="mic" type="button" class="mic-btn" aria-label="Voice message" title="Voice message">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></svg>
      </button>
      <input
        id="question"
        type="text"
        placeholder="Ask your question…"
        autocomplete="off"
        maxlength="2000"
        required
      />
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </form>

    <div id="recording-banner" class="recording-banner hidden">
      <span class="rec-dot"></span>
      <span id="recording-text">Listening… speak now</span>
      <button id="stop-mic" type="button">Stop</button>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
